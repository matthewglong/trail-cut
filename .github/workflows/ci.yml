# TrailCut CI — the ship-review tracer oracle (Phase 3, Thread 1 thin slice).
#
# One job on macOS (the current ship target): Vitest + cargo test, with
# nothing allowed to skip silently — the suites panic loudly on missing
# preconditions (ffmpeg, zscale, exiftool), so the job provisions all of
# them up front and fails fast if the runner image can't supply them.
#
# History: until ship-review Phase 4 (the HDR port) this workflow carried a
# second `hdr-tracer` job that ran the two `hdr_reference_white_tracer_*`
# tests as EXPECTED RED (the diagnosed npl=203 reference-white defect,
# docs/CANON.md §6.1) and went red itself on unexpected-green to force
# graduation. Phase 4 landed the fix (×2.03 SDR-origin anchor at ingest,
# npl=100 absolute working space); the tracers are green and now run in the
# main job below like any other test — a regression on them is a hard CI
# failure.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg-full (zscale-capable) + exiftool
        # The plain homebrew-core `ffmpeg` bottle has NO libzimg/zscale
        # (proven by CI run 27385616028) — the color pipeline requires it.
        # `ffmpeg-full` is the bottled core formula that includes zimg;
        # it is keg-only, so put its bin on PATH explicitly.
        run: |
          brew install ffmpeg-full exiftool
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Assert ffmpeg has zscale (libzimg)
        # Fail fast with a clear message if the bottle ever drops libzimg —
        # the color suite's assert_ffmpeg_has_zscale would catch it anyway,
        # but this pins the blame on provisioning, not tests.
        run: |
          if ! ffmpeg -hide_banner -filters | grep -q ' zscale '; then
            echo '::error title=Bad runner ffmpeg::runner ffmpeg has no zscale (libzimg) — the TrailCut color pipeline requires it; fix CI provisioning'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Cache patched mbgl-native binding
        # The renderer's native backend needs the PATCHED
        # @maplibre/maplibre-gl-native binding (expose-setGestureInProgress
        # — the raster anti-snap knob; see
        # src-tauri/sidecars/renderer/native/). build:renderer verifies the
        # staged artifact or builds it from source (~5 min); this cache makes
        # the build a once-per-bump cost. Keyed on the vendored patch + the
        # ensure script (which pins the upstream tag + ABI expectations).
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries/mbgl-native-*
          key: mbgl-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/sidecars/renderer/native/expose-setGestureInProgress.patch', 'src-tauri/sidecars/renderer/native/ensure-binding.mjs') }}

      - name: Install native-binding build tools (ninja)
        # Only exercised on a binding cache miss; cheap otherwise. cmake and
        # git ship on the macOS runner image already.
        run: brew install ninja ccache

      - name: Frontend tests (Vitest)
        run: npm run test:run

      - name: Build renderer sidecar (bundles + Chrome for Testing)
        # The orchestrator integration tests (tests/orchestrator.rs) drive
        # the REAL chromium renderer worker end-to-end: they need
        # dist/{renderer.cjs,setup_fixture.cjs} and the pinned Chrome for
        # Testing binary this script downloads into src-tauri/binaries/
        # (~170MB, host arch). Loud-failure rule: tests panic without these
        # preconditions, so CI provisions them — it does not skip. This also
        # satisfies tauri.conf.json's `binaries/chrome-*/**/*`
        # bundle.resources glob, which the Tauri build script errors on when
        # empty.
        run: npm run build:renderer

      - name: Rust tests (cargo)
        working-directory: src-tauri
        # Includes the hdr_reference_white_tracer_* tests — green since the
        # Phase 4 HDR port (graduated from the retired expected-red
        # hdr-tracer job). Everything must pass.
        run: cargo test
